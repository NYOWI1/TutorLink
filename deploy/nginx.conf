# Replace nyxen.centralindia.cloudapp.azure.com with your real domain, then obtain its TLS certificate.
server {
    listen 80;
    server_name nyxen.centralindia.cloudapp.azure.com;
    location /.well-known/acme-challenge/ { root /var/www/certbot; }
    location / { return 301 https://$host$request_uri; }
}
server {
    listen 443 ssl;
    server_name nyxen.centralindia.cloudapp.azure.com;
    ssl_certificate /etc/letsencrypt/live/nyxen.centralindia.cloudapp.azure.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/nyxen.centralindia.cloudapp.azure.com/privkey.pem;
    client_max_body_size 1m;
    location / {
        proxy_pass http://127.0.0.1:3000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
    }
    location ~ ^/api/(auth/login|users)$ {
        limit_req zone=tutorlink_auth burst=10 nodelay;
        proxy_pass http://127.0.0.1:3000;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}
# Add this inside the http {} block in /etc/nginx/nginx.conf:
# limit_req_zone $binary_remote_addr zone=tutorlink_auth:10m rate=10r/m;
